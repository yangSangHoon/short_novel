name: GitHub Pages

on:
  push:
    branches:
      - "claude/wonderful-faraday-022nks"
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Pages 는 없는 경로에 404.html 을 내려준다. index 를 그대로 복사해 두면
      # /read/xxx 로 바로 들어오거나 새로고침해도 SPA 라우팅이 살아 있다.
      - run: cp dist/index.html dist/404.html

      # Jekyll 이 _ 로 시작하는 파일을 걸러내지 않도록
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
